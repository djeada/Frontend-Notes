<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
  <title id="title">A simplified CSS cascade diagnostic</title>
  <desc id="desc">Six steps, from finding relevant declarations to considering source order. Transitions, animations, and important declarations require additional care.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#334155"/></marker></defs>
  <rect width="960" height="260" rx="20" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#0f172a">
    <g fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"><rect x="18" y="50" width="135" height="110" rx="12"/><rect x="176" y="50" width="135" height="110" rx="12"/><rect x="334" y="50" width="135" height="110" rx="12"/><rect x="492" y="50" width="135" height="110" rx="12"/><rect x="650" y="50" width="135" height="110" rx="12"/><rect x="808" y="50" width="135" height="110" rx="12"/></g>
    <g font-weight="bold"><text x="85" y="86">1. Relevance</text><text x="243" y="86">2. Origin</text><text x="401" y="86">3. Layers</text><text x="559" y="86">4. Specificity</text><text x="717" y="86">5. Scope</text><text x="875" y="86">6. Order</text></g>
    <g font-size="13"><text x="85" y="111">selector, media</text><text x="85" y="130">query, support</text><text x="243" y="111">and</text><text x="243" y="130">importance</text><text x="401" y="111">layer</text><text x="401" y="130">precedence</text><text x="559" y="111">selector</text><text x="559" y="130">weight</text><text x="717" y="111">proximity</text><text x="717" y="130">if scoped</text><text x="875" y="111">last matching</text><text x="875" y="130">declaration</text></g>
    <g stroke="#334155" stroke-width="2" marker-end="url(#arrow)"><path d="M155 105H174"/><path d="M313 105H332"/><path d="M471 105H490"/><path d="M629 105H648"/><path d="M787 105H806"/></g>
    <text x="480" y="30" font-size="21" font-weight="bold">Why did this CSS declaration win?</text>
    <text x="480" y="197" font-size="14">Simplified authoring checklist; transitions, animations, and !important have special cascade precedence.</text>
    <text x="480" y="224" font-size="14">Use browser DevTools to inspect matched, overridden, and computed declarations.</text>
  </g>
</svg>
