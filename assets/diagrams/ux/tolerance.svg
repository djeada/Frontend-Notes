<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" role="img" aria-labelledby="title desc"><title id="title">Tolerance: prevent errors and support recovery</title><desc id="desc">The left has an unexplained irreversible delete. The right names the object, offers cancel, and includes a time-limited undo example.</desc><rect x="0" y="0" width="1040" height="470" rx="18" fill="#f8fafc"/><g font-family="Arial,sans-serif"><text x="34" y="46" fill="#0f172a" font-size="29" font-weight="700">Tolerance: prevent errors and support recovery</text><text x="34" y="82" fill="#475569" font-size="16" font-weight="400">Only promise undo if the application really supports recovery.</text><rect x="34" y="122" width="476" height="300" rx="15" fill="#ffffff" stroke="#cbd5e1"/><text x="56" y="156" fill="#0f172a" font-size="21" font-weight="700">BEFORE · irreversible delete</text><rect x="530" y="122" width="476" height="300" rx="15" fill="#ffffff" stroke="#cbd5e1"/><text x="552" y="156" fill="#0f172a" font-size="21" font-weight="700">AFTER · confirm and undo</text><rect x="77" y="228" width="218" height="60" rx="8" fill="#b91c1c"/><text x="186" y="265" fill="#ffffff" font-size="19" font-weight="700" text-anchor="middle">Delete forever</text><text x="77" y="323" fill="#475569" font-size="16" font-weight="400">No description or recovery</text><rect x="569" y="191" width="388" height="126" rx="10" fill="#ffffff" stroke="#94a3b8"/><text x="591" y="224" fill="#0f172a" font-size="20" font-weight="700">Delete this draft?</text><text x="591" y="250" fill="#475569" font-size="16" font-weight="400">This can be restored for 30 seconds.</text><rect x="591" y="264" width="144" height="42" rx="7" fill="#e2e8f0"/><text x="663" y="291" fill="#0f172a" font-size="16" font-weight="700" text-anchor="middle">Cancel</text><rect x="752" y="264" width="175" height="42" rx="7" fill="#b91c1c"/><text x="839" y="291" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle">Delete draft</text><rect x="569" y="331" width="388" height="55" rx="8" fill="#dcfce7"/><text x="591" y="365" fill="#166534" font-size="17" font-weight="700">Draft deleted  ·  Undo</text></g></svg>
