<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 510" role="img" aria-labelledby="title desc">
<title id="title">60–30–10 color rule: proportional palette and an example interface</title>
<desc id="desc">A 600-pixel dominant segment, 300-pixel secondary segment, and 100-pixel accent segment form a 60/30/10 bar. A sample interface shows a mostly light background, a navy panel, and a teal primary action. These are illustrative proportions, not accessibility or usability guarantees.</desc>
<rect width="1040" height="510" rx="18" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#0f172a"><text x="36" y="48" font-size="29" font-weight="700">60–30–10 · balance color by visual area</text><text x="36" y="83" font-size="17" fill="#475569">A starting guideline — adapt it to content, brand, contrast, and task.</text></g>
<g font-family="Arial, sans-serif" font-size="17" font-weight="700"><rect x="36" y="111" width="580" height="82" rx="8" fill="#e2e8f0"/><rect x="616" y="111" width="290" height="82" fill="#243b53"/><rect x="906" y="111" width="98" height="82" rx="8" fill="#087f8c"/><text x="326" y="157" fill="#0f172a" text-anchor="middle">60% dominant</text><text x="761" y="157" fill="#fff" text-anchor="middle">30% secondary</text><text x="955" y="152" fill="#fff" font-size="15" text-anchor="middle">10%</text><text x="955" y="173" fill="#fff" font-size="13" text-anchor="middle">accent</text></g>
<rect x="36" y="216" width="968" height="260" rx="14" fill="#e2e8f0" stroke="#94a3b8"/><rect x="58" y="235" width="287" height="222" rx="11" fill="#243b53"/><g font-family="Arial,sans-serif" fill="white"><text x="80" y="274" font-size="25" font-weight="700">Learning portal</text><text x="80" y="318" font-size="18">Overview</text><text x="80" y="351" font-size="18">Your courses</text><text x="80" y="384" font-size="18">Settings</text></g><rect x="369" y="235" width="611" height="222" rx="11" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#0f172a"><text x="397" y="278" font-size="26" font-weight="700">Keep learning</text><text x="397" y="314" font-size="17" fill="#475569">Resume the next lesson when you are ready.</text><rect x="397" y="340" width="228" height="72" rx="10" fill="#087f8c"/><text x="511" y="382" font-size="18" fill="white" font-weight="700" text-anchor="middle">Continue course</text><text x="648" y="376" font-size="15" fill="#475569">Accent signals the action.</text></g><text x="36" y="500" font-size="14" font-family="Arial,sans-serif" fill="#475569">Illustrative schematic; check text contrast, states, meaning and user tasks separately.</text>
</svg>
