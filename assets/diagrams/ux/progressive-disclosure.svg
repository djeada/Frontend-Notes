<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" role="img" aria-labelledby="title desc"><title id="title">Progressive disclosure: start with essentials</title><desc id="desc">Eight settings crowd the first panel; the second foregrounds identity fields and labels advanced options as available on demand.</desc><rect x="0" y="0" width="1040" height="470" rx="18" fill="#f8fafc"/><g font-family="Arial,sans-serif"><text x="34" y="46" fill="#0f172a" font-size="29" font-weight="700">Progressive disclosure: start with essentials</text><text x="34" y="82" fill="#475569" font-size="16" font-weight="400">Do not hide required fields or necessary warnings.</text><rect x="34" y="122" width="476" height="300" rx="15" fill="#ffffff" stroke="#cbd5e1"/><text x="56" y="156" fill="#0f172a" font-size="21" font-weight="700">BEFORE · every setting at once</text><rect x="530" y="122" width="476" height="300" rx="15" fill="#ffffff" stroke="#cbd5e1"/><text x="552" y="156" fill="#0f172a" font-size="21" font-weight="700">AFTER · essentials then advanced</text><rect x="67" y="185" width="386" height="21" rx="4" fill="#e2e8f0"/><text x="77" y="201" fill="#475569" font-size="14" font-weight="400">Setting 1</text><rect x="67" y="211" width="386" height="21" rx="4" fill="#e2e8f0"/><text x="77" y="227" fill="#475569" font-size="14" font-weight="400">Setting 2</text><rect x="67" y="237" width="386" height="21" rx="4" fill="#e2e8f0"/><text x="77" y="253" fill="#475569" font-size="14" font-weight="400">Setting 3</text><rect x="67" y="263" width="386" height="21" rx="4" fill="#e2e8f0"/><text x="77" y="279" fill="#475569" font-size="14" font-weight="400">Setting 4</text><rect x="67" y="289" width="386" height="21" rx="4" fill="#e2e8f0"/><text x="77" y="305" fill="#475569" font-size="14" font-weight="400">Setting 5</text><rect x="67" y="315" width="386" height="21" rx="4" fill="#e2e8f0"/><text x="77" y="331" fill="#475569" font-size="14" font-weight="400">Setting 6</text><rect x="67" y="341" width="386" height="21" rx="4" fill="#e2e8f0"/><text x="77" y="357" fill="#475569" font-size="14" font-weight="400">Setting 7</text><rect x="67" y="367" width="386" height="21" rx="4" fill="#e2e8f0"/><text x="77" y="383" fill="#475569" font-size="14" font-weight="400">Setting 8</text><rect x="562" y="180" width="400" height="162" rx="11" fill="#ffffff" stroke="#94a3b8"/><text x="582" y="221" fill="#0f172a" font-size="21" font-weight="700">Profile settings</text><text x="582" y="254" fill="#475569" font-size="16" font-weight="400">Name and email first</text><rect x="582" y="274" width="170" height="47" rx="8" fill="#1d4ed8"/><text x="667" y="303" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">Save</text><rect x="562" y="358" width="386" height="50" rx="6" fill="#e2e8f0"/><text x="583" y="390" fill="#0f172a" font-size="18" font-weight="700">Advanced settings  ▸</text></g></svg>
