<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" role="img" aria-labelledby="title desc"><title id="title">Consistency: make equivalent actions predictable</title><desc id="desc">The left uses unrelated wording and styles for save-like actions. The right names distinct actions consistently and preserves a separate destructive style.</desc><rect x="0" y="0" width="1040" height="470" rx="18" fill="#f8fafc"/><g font-family="Arial,sans-serif"><text x="34" y="46" fill="#0f172a" font-size="29" font-weight="700">Consistency: make equivalent actions predictable</text><text x="34" y="82" fill="#475569" font-size="16" font-weight="400">Consistency covers labels and behavior, not just colors.</text><rect x="34" y="122" width="476" height="300" rx="15" fill="#ffffff" stroke="#cbd5e1"/><text x="56" y="156" fill="#0f172a" font-size="21" font-weight="700">BEFORE · inconsistent actions</text><rect x="530" y="122" width="476" height="300" rx="15" fill="#ffffff" stroke="#cbd5e1"/><text x="552" y="156" fill="#0f172a" font-size="21" font-weight="700">AFTER · consistent meaning</text><rect x="71" y="198" width="155" height="50" rx="5" fill="#e2e8f0"/><text x="148.5" y="229" fill="#0f172a" font-size="16" font-weight="700" text-anchor="middle">SAVE</text><rect x="256" y="264" width="158" height="50" rx="5" fill="#f59e0b"/><text x="335.0" y="295" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle">Submit</text><rect x="99" y="342" width="212" height="50" rx="5" fill="#1d4ed8"/><text x="205.0" y="373" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle">Finish!</text><rect x="576" y="186" width="205" height="49" rx="8" fill="#1d4ed8"/><text x="678" y="216" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle">Save draft</text><rect x="576" y="255" width="205" height="49" rx="8" fill="#1d4ed8"/><text x="678" y="285" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle">Save changes</text><rect x="576" y="324" width="205" height="49" rx="8" fill="#b91c1c"/><text x="678" y="354" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle">Delete draft</text></g></svg>
