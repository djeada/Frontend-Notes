<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" role="img" aria-labelledby="title desc"><title id="title">Tesler: do not export avoidable complexity</title><desc id="desc">A form asks for repeated address fields; a second offers optional postcode-assisted suggestions that users can review and edit.</desc><rect x="0" y="0" width="1040" height="470" rx="18" fill="#f8fafc"/><g font-family="Arial,sans-serif"><text x="34" y="46" fill="#0f172a" font-size="29" font-weight="700">Tesler: do not export avoidable complexity</text><text x="34" y="82" fill="#475569" font-size="16" font-weight="400">Only auto-fill when source data is reliable and editable.</text><rect x="34" y="122" width="476" height="300" rx="15" fill="#ffffff" stroke="#cbd5e1"/><text x="56" y="156" fill="#0f172a" font-size="21" font-weight="700">BEFORE · manual repetitive entry</text><rect x="530" y="122" width="476" height="300" rx="15" fill="#ffffff" stroke="#cbd5e1"/><text x="552" y="156" fill="#0f172a" font-size="21" font-weight="700">AFTER · assist, allow edits</text><rect x="65" y="181" width="388" height="35" rx="5" fill="#e2e8f0"/><text x="79" y="205" fill="#475569" font-size="16" font-weight="400">Street</text><rect x="65" y="224" width="388" height="35" rx="5" fill="#e2e8f0"/><text x="79" y="248" fill="#475569" font-size="16" font-weight="400">City</text><rect x="65" y="267" width="388" height="35" rx="5" fill="#e2e8f0"/><text x="79" y="291" fill="#475569" font-size="16" font-weight="400">Region</text><rect x="65" y="310" width="388" height="35" rx="5" fill="#e2e8f0"/><text x="79" y="334" fill="#475569" font-size="16" font-weight="400">Postcode</text><rect x="65" y="353" width="388" height="35" rx="5" fill="#e2e8f0"/><text x="79" y="377" fill="#475569" font-size="16" font-weight="400">Country</text><rect x="562" y="186" width="388" height="54" rx="7" fill="#ffffff" stroke="#94a3b8"/><text x="582" y="220" fill="#0f172a" font-size="17" font-weight="400">Postcode</text><rect x="562" y="253" width="388" height="70" rx="7" fill="#dcfce7"/><text x="582" y="284" fill="#0f172a" font-size="17" font-weight="700">Suggested city and region</text><text x="582" y="306" fill="#475569" font-size="15" font-weight="400">Review or edit the suggestion</text><rect x="562" y="339" width="171" height="49" rx="7" fill="#1d4ed8"/><text x="648" y="369" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle">Continue</text></g></svg>
