<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" role="img" aria-labelledby="title desc"><title id="title">Visibility: reveal relevant affordances</title><desc id="desc">Three unlabeled icons compete with a clearly labeled shipping-information card and action.</desc><rect x="0" y="0" width="1040" height="470" rx="18" fill="#f8fafc"/><g font-family="Arial,sans-serif"><text x="34" y="46" fill="#0f172a" font-size="29" font-weight="700">Visibility: reveal relevant affordances</text><text x="34" y="82" fill="#475569" font-size="16" font-weight="400">Discoverability requires meaningful names, not only decorative icons.</text><rect x="34" y="122" width="476" height="300" rx="15" fill="#ffffff" stroke="#cbd5e1"/><text x="56" y="156" fill="#0f172a" font-size="21" font-weight="700">BEFORE · ambiguous icons</text><rect x="530" y="122" width="476" height="300" rx="15" fill="#ffffff" stroke="#cbd5e1"/><text x="552" y="156" fill="#0f172a" font-size="21" font-weight="700">AFTER · labeled controls</text><rect x="92" y="230" width="72" height="65" rx="8" fill="#e2e8f0"/><text x="128" y="274" fill="#0f172a" font-size="29" font-weight="700" text-anchor="middle">?</text><rect x="208" y="230" width="72" height="65" rx="8" fill="#e2e8f0"/><text x="244" y="274" fill="#0f172a" font-size="29" font-weight="700" text-anchor="middle">★</text><rect x="324" y="230" width="72" height="65" rx="8" fill="#e2e8f0"/><text x="360" y="274" fill="#0f172a" font-size="29" font-weight="700" text-anchor="middle">≡</text><rect x="569" y="188" width="400" height="162" rx="11" fill="#ffffff" stroke="#94a3b8"/><text x="589" y="229" fill="#0f172a" font-size="21" font-weight="700">Shipping information</text><text x="589" y="262" fill="#475569" font-size="16" font-weight="400">Fees, delivery dates, and returns</text><rect x="589" y="282" width="170" height="47" rx="8" fill="#087f8c"/><text x="674" y="311" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">View shipping</text></g></svg>
