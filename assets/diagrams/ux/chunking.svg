<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" role="img" aria-labelledby="title desc"><title id="title">Chunking: organize related information</title><desc id="desc">Nine ungrouped labels on the left become three titled groups of three on the right. The numbers are illustrative, not a universal memory threshold.</desc><rect x="0" y="0" width="1040" height="470" rx="18" fill="#f8fafc"/><g font-family="Arial,sans-serif"><text x="34" y="46" fill="#0f172a" font-size="29" font-weight="700">Chunking: organize related information</text><text x="34" y="82" fill="#475569" font-size="16" font-weight="400">Group by users’ mental models; validate headings with tasks.</text><rect x="34" y="122" width="476" height="300" rx="15" fill="#ffffff" stroke="#cbd5e1"/><text x="56" y="156" fill="#0f172a" font-size="21" font-weight="700">BEFORE · one ungrouped list</text><rect x="530" y="122" width="476" height="300" rx="15" fill="#ffffff" stroke="#cbd5e1"/><text x="552" y="156" fill="#0f172a" font-size="21" font-weight="700">AFTER · meaningful chunks</text><text x="79" y="196" fill="#0f172a" font-size="16" font-weight="400">Item 1</text><text x="79" y="219" fill="#0f172a" font-size="16" font-weight="400">Item 2</text><text x="79" y="242" fill="#0f172a" font-size="16" font-weight="400">Item 3</text><text x="79" y="265" fill="#0f172a" font-size="16" font-weight="400">Item 4</text><text x="79" y="288" fill="#0f172a" font-size="16" font-weight="400">Item 5</text><text x="79" y="311" fill="#0f172a" font-size="16" font-weight="400">Item 6</text><text x="79" y="334" fill="#0f172a" font-size="16" font-weight="400">Item 7</text><text x="79" y="357" fill="#0f172a" font-size="16" font-weight="400">Item 8</text><text x="79" y="380" fill="#0f172a" font-size="16" font-weight="400">Item 9</text><rect x="558" y="182" width="126" height="209" rx="8" fill="#e2e8f0"/><text x="568" y="208" fill="#1d4ed8" font-size="16" font-weight="700">Account</text><text x="568" y="249" fill="#0f172a" font-size="14" font-weight="400">Profile</text><text x="568" y="289" fill="#0f172a" font-size="14" font-weight="400">Security</text><text x="568" y="329" fill="#0f172a" font-size="14" font-weight="400">Billing</text><rect x="697" y="182" width="126" height="209" rx="8" fill="#e2e8f0"/><text x="707" y="208" fill="#1d4ed8" font-size="16" font-weight="700">Content</text><text x="707" y="249" fill="#0f172a" font-size="14" font-weight="400">Library</text><text x="707" y="289" fill="#0f172a" font-size="14" font-weight="400">Saved</text><text x="707" y="329" fill="#0f172a" font-size="14" font-weight="400">History</text><rect x="836" y="182" width="126" height="209" rx="8" fill="#e2e8f0"/><text x="846" y="208" fill="#1d4ed8" font-size="16" font-weight="700">Support</text><text x="846" y="249" fill="#0f172a" font-size="14" font-weight="400">Help</text><text x="846" y="289" fill="#0f172a" font-size="14" font-weight="400">Contact</text><text x="846" y="329" fill="#0f172a" font-size="14" font-weight="400">Status</text></g></svg>
