<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" role="img" aria-labelledby="title desc"><title id="title">Jakob’s law: familiar patterns</title><desc id="desc">A page hides navigation behind unlabeled unusual icons; a second uses conventional labeled links at the top.</desc><rect x="0" y="0" width="1040" height="470" rx="18" fill="#f8fafc"/><g font-family="Arial,sans-serif"><text x="34" y="46" fill="#0f172a" font-size="29" font-weight="700">Jakob’s law: familiar patterns</text><text x="34" y="82" fill="#475569" font-size="16" font-weight="400">Preserve familiar patterns when appropriate to your audience.</text><rect x="34" y="122" width="476" height="300" rx="15" fill="#ffffff" stroke="#cbd5e1"/><text x="56" y="156" fill="#0f172a" font-size="21" font-weight="700">BEFORE · unexpected navigation</text><rect x="530" y="122" width="476" height="300" rx="15" fill="#ffffff" stroke="#cbd5e1"/><text x="552" y="156" fill="#0f172a" font-size="21" font-weight="700">AFTER · familiar labeled navigation</text><rect x="77" y="190" width="383" height="184" rx="9" fill="#e2e8f0"/><text x="100" y="226" fill="#0f172a" font-size="21" font-weight="700">Dashboard</text><circle cx="151" cy="340" r="27" fill="#243b53"/><text x="151" y="349" fill="#ffffff" font-size="23" font-weight="700" text-anchor="middle">◈</text><circle cx="264" cy="340" r="27" fill="#243b53"/><text x="264" y="349" fill="#ffffff" font-size="23" font-weight="700" text-anchor="middle">☆</text><circle cx="377" cy="340" r="27" fill="#243b53"/><text x="377" y="349" fill="#ffffff" font-size="23" font-weight="700" text-anchor="middle">?</text><rect x="562" y="190" width="395" height="66" rx="7" fill="#243b53"/><text x="591" y="232" fill="#ffffff" font-size="17" font-weight="700">Home</text><text x="715" y="232" fill="#ffffff" font-size="17" font-weight="700">Courses</text><text x="839" y="232" fill="#ffffff" font-size="17" font-weight="700">Help</text><text x="581" y="321" fill="#0f172a" font-size="17" font-weight="400">Page content appears below the navigation</text></g></svg>
