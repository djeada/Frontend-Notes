<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" role="img" aria-labelledby="title desc"><title id="title">Pareto 80/20: check the data</title><desc id="desc">A hypothetical observed activity split illustrates 2 of 10 features associated with 80 of 100 actions, not a universal UX distribution.</desc><rect x="0" y="0" width="1040" height="470" rx="18" fill="#f8fafc"/><g font-family="Arial,sans-serif"><text x="34" y="46" fill="#0f172a" font-size="29" font-weight="700">Pareto 80/20: check the data</text><text x="34" y="82" fill="#475569" font-size="16" font-weight="400">Do not hide infrequent but critical tasks solely from usage counts.</text><rect x="45" y="162" width="950" height="82" rx="8" fill="#e2e8f0"/><rect x="45" y="162" width="760" height="82" rx="8" fill="#087f8c"/><rect x="805" y="162" width="190" height="82" rx="8" fill="#243b53"/><text x="425" y="212" fill="#ffffff" font-size="21" font-weight="700" text-anchor="middle">80 observed events · two features</text><text x="901" y="212" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">20 events</text><rect x="47" y="281" width="77" height="64" rx="6" fill="#087f8c"/><text x="85" y="323" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">F1</text><rect x="143" y="281" width="77" height="64" rx="6" fill="#087f8c"/><text x="181" y="323" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">F2</text><rect x="239" y="281" width="77" height="64" rx="6" fill="#cbd5e1"/><text x="277" y="323" fill="#0f172a" font-size="17" font-weight="700" text-anchor="middle">F3</text><rect x="335" y="281" width="77" height="64" rx="6" fill="#cbd5e1"/><text x="373" y="323" fill="#0f172a" font-size="17" font-weight="700" text-anchor="middle">F4</text><rect x="431" y="281" width="77" height="64" rx="6" fill="#cbd5e1"/><text x="469" y="323" fill="#0f172a" font-size="17" font-weight="700" text-anchor="middle">F5</text><rect x="527" y="281" width="77" height="64" rx="6" fill="#cbd5e1"/><text x="565" y="323" fill="#0f172a" font-size="17" font-weight="700" text-anchor="middle">F6</text><rect x="623" y="281" width="77" height="64" rx="6" fill="#cbd5e1"/><text x="661" y="323" fill="#0f172a" font-size="17" font-weight="700" text-anchor="middle">F7</text><rect x="719" y="281" width="77" height="64" rx="6" fill="#cbd5e1"/><text x="757" y="323" fill="#0f172a" font-size="17" font-weight="700" text-anchor="middle">F8</text><rect x="815" y="281" width="77" height="64" rx="6" fill="#cbd5e1"/><text x="853" y="323" fill="#0f172a" font-size="17" font-weight="700" text-anchor="middle">F9</text><rect x="911" y="281" width="77" height="64" rx="6" fill="#cbd5e1"/><text x="949" y="323" fill="#0f172a" font-size="17" font-weight="700" text-anchor="middle">F10</text><text x="50" y="393" fill="#475569" font-size="17" font-weight="400">Hypothetical example: 2 of 10 features account for 80 of 100 recorded actions.</text></g></svg>
