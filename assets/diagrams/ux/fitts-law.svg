<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" role="img" aria-labelledby="title desc"><title id="title">Fitts: distance and target size</title><desc id="desc">Two pointer paths show a small distant target versus a larger nearby target; labels explain the design tradeoff.</desc><rect x="0" y="0" width="1040" height="470" rx="18" fill="#f8fafc"/><g font-family="Arial,sans-serif"><text x="34" y="46" fill="#0f172a" font-size="29" font-weight="700">Fitts: distance and target size</text><text x="34" y="82" fill="#475569" font-size="16" font-weight="400">Check actual pointer/touch tasks and WCAG target-size requirements.</text><rect x="34" y="122" width="476" height="300" rx="15" fill="#ffffff" stroke="#cbd5e1"/><text x="56" y="156" fill="#0f172a" font-size="21" font-weight="700">BEFORE · tiny, distant target</text><rect x="530" y="122" width="476" height="300" rx="15" fill="#ffffff" stroke="#cbd5e1"/><text x="552" y="156" fill="#0f172a" font-size="21" font-weight="700">AFTER · larger, nearby target</text><circle cx="98" cy="362" r="13" fill="#0f172a"/><path d="M98 362 L396 202" stroke="#e11d48" stroke-width="4" fill="none" /><rect x="399" y="182" width="40" height="32" rx="4" fill="#1d4ed8"/><circle cx="605" cy="362" r="13" fill="#0f172a"/><path d="M605 362 L725 296" stroke="#087f8c" stroke-width="4" fill="none" /><rect x="728" y="246" width="195" height="69" rx="12" fill="#1d4ed8"/><text x="825" y="287" fill="#ffffff" font-size="21" font-weight="700" text-anchor="middle">Next step</text></g></svg>
