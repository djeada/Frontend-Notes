<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" role="img" aria-labelledby="title desc"><title id="title">UX is an iterative evidence loop</title><desc id="desc">Eight stages show how defining a task, observing, testing and monitoring connect, with a return loop to new questions.</desc><rect x="0" y="0" width="1040" height="470" rx="18" fill="#f8fafc"/><g font-family="Arial,sans-serif"><text x="34" y="46" fill="#0f172a" font-size="29" font-weight="700">UX is an iterative evidence loop</text><text x="34" y="82" fill="#475569" font-size="16" font-weight="400">A handoff is not the end of research; revisit decisions after release.</text><rect x="44" y="142" width="224" height="93" rx="12" fill="#dbeafe"/><circle cx="70" cy="188" r="15" fill="#1d4ed8"/><text x="70" y="194" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">1</text><text x="91" y="195" fill="#0f172a" font-size="17" font-weight="700">Define task</text><path d="M268 188 L287 188" stroke="#1d4ed8" stroke-width="3" fill="none" /><rect x="291" y="142" width="224" height="93" rx="12" fill="#dbeafe"/><circle cx="317" cy="188" r="15" fill="#1d4ed8"/><text x="317" y="194" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">2</text><text x="338" y="195" fill="#0f172a" font-size="17" font-weight="700">Observe</text><path d="M515 188 L534 188" stroke="#1d4ed8" stroke-width="3" fill="none" /><rect x="538" y="142" width="224" height="93" rx="12" fill="#dbeafe"/><circle cx="564" cy="188" r="15" fill="#1d4ed8"/><text x="564" y="194" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">3</text><text x="585" y="195" fill="#0f172a" font-size="17" font-weight="700">Synthesize</text><path d="M762 188 L781 188" stroke="#1d4ed8" stroke-width="3" fill="none" /><rect x="785" y="142" width="224" height="93" rx="12" fill="#dbeafe"/><circle cx="811" cy="188" r="15" fill="#1d4ed8"/><text x="811" y="194" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">4</text><text x="832" y="195" fill="#0f172a" font-size="17" font-weight="700">Sketch</text><rect x="44" y="278" width="224" height="93" rx="12" fill="#ccfbf1"/><circle cx="70" cy="324" r="15" fill="#087f8c"/><text x="70" y="330" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">5</text><text x="91" y="331" fill="#0f172a" font-size="17" font-weight="700">Prototype</text><path d="M268 324 L287 324" stroke="#1d4ed8" stroke-width="3" fill="none" /><rect x="291" y="278" width="224" height="93" rx="12" fill="#ccfbf1"/><circle cx="317" cy="324" r="15" fill="#087f8c"/><text x="317" y="330" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">6</text><text x="338" y="331" fill="#0f172a" font-size="17" font-weight="700">Evaluate</text><path d="M515 324 L534 324" stroke="#1d4ed8" stroke-width="3" fill="none" /><rect x="538" y="278" width="224" height="93" rx="12" fill="#ccfbf1"/><circle cx="564" cy="324" r="15" fill="#087f8c"/><text x="564" y="330" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">7</text><text x="585" y="331" fill="#0f172a" font-size="17" font-weight="700">Ship</text><path d="M762 324 L781 324" stroke="#1d4ed8" stroke-width="3" fill="none" /><rect x="785" y="278" width="224" height="93" rx="12" fill="#ccfbf1"/><circle cx="811" cy="324" r="15" fill="#087f8c"/><text x="811" y="330" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">8</text><text x="832" y="331" fill="#0f172a" font-size="17" font-weight="700">Monitor</text><path d="M966 235 L966 262" stroke="#087f8c" stroke-width="3" fill="none" /><path d="M44 389 L44 425" stroke="#087f8c" stroke-width="3" fill="none" /><text x="65" y="440" fill="#087f8c" font-size="16" font-weight="700">Repeat when evidence challenges the design</text></g></svg>
