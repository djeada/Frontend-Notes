<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" role="img" aria-labelledby="title desc"><title id="title">Recognition over recall: show available actions</title><desc id="desc">A command-only input requires recalling syntax; labeled Edit, Share, and Delete controls expose available actions.</desc><rect x="0" y="0" width="1040" height="470" rx="18" fill="#f8fafc"/><g font-family="Arial,sans-serif"><text x="34" y="46" fill="#0f172a" font-size="29" font-weight="700">Recognition over recall: show available actions</text><text x="34" y="82" fill="#475569" font-size="16" font-weight="400">Make labels descriptive; still support expert shortcuts.</text><rect x="34" y="122" width="476" height="300" rx="15" fill="#ffffff" stroke="#cbd5e1"/><text x="56" y="156" fill="#0f172a" font-size="21" font-weight="700">BEFORE · remember a command</text><rect x="530" y="122" width="476" height="300" rx="15" fill="#ffffff" stroke="#cbd5e1"/><text x="552" y="156" fill="#0f172a" font-size="21" font-weight="700">AFTER · recognize an action</text><rect x="77" y="223" width="384" height="64" rx="8" fill="#243b53"/><text x="96" y="264" fill="#ffffff" font-size="19" font-weight="400">Enter command: _______</text><text x="77" y="327" fill="#475569" font-size="17" font-weight="400">Recall the delete shortcut?</text><rect x="560" y="223" width="120" height="65" rx="8" fill="#1d4ed8"/><text x="620" y="262" fill="#ffffff" font-size="19" font-weight="700" text-anchor="middle">Edit</text><rect x="692" y="223" width="120" height="65" rx="8" fill="#1d4ed8"/><text x="752" y="262" fill="#ffffff" font-size="19" font-weight="700" text-anchor="middle">Share</text><rect x="824" y="223" width="120" height="65" rx="8" fill="#b91c1c"/><text x="884" y="262" fill="#ffffff" font-size="19" font-weight="700" text-anchor="middle">Delete</text><text x="561" y="337" fill="#475569" font-size="17" font-weight="400">Visible labels reduce memory demands.</text></g></svg>
