<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" role="img" aria-labelledby="title desc"><title id="title">Feedback: communicate real system status</title><desc id="desc">Before shows an action with no response; after illustrates loading, success, and actionable failure states.</desc><rect x="0" y="0" width="1040" height="470" rx="18" fill="#f8fafc"/><g font-family="Arial,sans-serif"><text x="34" y="46" fill="#0f172a" font-size="29" font-weight="700">Feedback: communicate real system status</text><text x="34" y="82" fill="#475569" font-size="16" font-weight="400">Show truthful status in text; do not announce success before completion.</text><rect x="34" y="122" width="476" height="300" rx="15" fill="#ffffff" stroke="#cbd5e1"/><text x="56" y="156" fill="#0f172a" font-size="21" font-weight="700">BEFORE · silent submission</text><rect x="530" y="122" width="476" height="300" rx="15" fill="#ffffff" stroke="#cbd5e1"/><text x="552" y="156" fill="#0f172a" font-size="21" font-weight="700">AFTER · status and recovery</text><rect x="70" y="197" width="400" height="162" rx="11" fill="#ffffff" stroke="#94a3b8"/><text x="90" y="238" fill="#0f172a" font-size="21" font-weight="700">Your changes</text><text x="90" y="271" fill="#475569" font-size="16" font-weight="400">The Save action gives no response</text><rect x="90" y="291" width="170" height="47" rx="8" fill="#1d4ed8"/><text x="175" y="320" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">Save</text><rect x="567" y="185" width="395" height="57" rx="8" fill="#dbeafe"/><text x="587" y="221" fill="#0f172a" font-size="16" font-weight="400">Saving…  Step 1: request in progress</text><rect x="567" y="256" width="395" height="57" rx="8" fill="#dcfce7"/><text x="587" y="292" fill="#166534" font-size="16" font-weight="700">Saved  ·  changes are available</text><rect x="567" y="327" width="395" height="57" rx="8" fill="#fee2e2"/><text x="587" y="363" fill="#991b1b" font-size="16" font-weight="700">Could not save · Retry</text></g></svg>
