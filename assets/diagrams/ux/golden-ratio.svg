<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" role="img" aria-labelledby="title desc"><title id="title">Golden ratio: a possible proportion</title><desc id="desc">A schematic content/sidebar split of about 61.8 percent and 38.2 percent. It does not establish a universal preference or accessibility benefit.</desc><rect x="0" y="0" width="1040" height="470" rx="18" fill="#f8fafc"/><g font-family="Arial,sans-serif"><text x="34" y="46" fill="#0f172a" font-size="29" font-weight="700">Golden ratio: a possible proportion</text><text x="34" y="82" fill="#475569" font-size="16" font-weight="400">Use proportions as a sketching option; measure reading and layout.</text><rect x="42" y="138" width="956" height="258" rx="10" fill="#ffffff" stroke="#94a3b8"/><rect x="42" y="138" width="591" height="258" rx="0" fill="#dbeafe"/><rect x="633" y="138" width="365" height="258" rx="0" fill="#243b53"/><text x="337" y="270" fill="#0f172a" font-size="23" font-weight="700" text-anchor="middle">Main area · 61.8%</text><text x="815" y="270" fill="#ffffff" font-size="21" font-weight="700" text-anchor="middle">Sidebar · 38.2%</text></g></svg>
