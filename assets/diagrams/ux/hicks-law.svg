<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" role="img" aria-labelledby="title desc"><title id="title">Hick–Hyman: choices and decision time</title><desc id="desc">An example of 12 unrelated options compared with three clear entry paths. This illustrates possible organization, not measured response times.</desc><rect x="0" y="0" width="1040" height="470" rx="18" fill="#f8fafc"/><g font-family="Arial,sans-serif"><text x="34" y="46" fill="#0f172a" font-size="29" font-weight="700">Hick–Hyman: choices and decision time</text><text x="34" y="82" fill="#475569" font-size="16" font-weight="400">Decision time depends on familiarity, meaning, probability and context.</text><rect x="34" y="122" width="476" height="300" rx="15" fill="#ffffff" stroke="#cbd5e1"/><text x="56" y="156" fill="#0f172a" font-size="21" font-weight="700">BEFORE · 12 equal-looking choices</text><rect x="530" y="122" width="476" height="300" rx="15" fill="#ffffff" stroke="#cbd5e1"/><text x="552" y="156" fill="#0f172a" font-size="21" font-weight="700">AFTER · task-oriented groups</text><rect x="65" y="188" width="123" height="43" rx="7" fill="#e2e8f0"/><text x="126" y="216" fill="#0f172a" font-size="15" font-weight="400" text-anchor="middle">Option 1</text><rect x="207" y="188" width="123" height="43" rx="7" fill="#e2e8f0"/><text x="268" y="216" fill="#0f172a" font-size="15" font-weight="400" text-anchor="middle">Option 2</text><rect x="349" y="188" width="123" height="43" rx="7" fill="#e2e8f0"/><text x="410" y="216" fill="#0f172a" font-size="15" font-weight="400" text-anchor="middle">Option 3</text><rect x="65" y="242" width="123" height="43" rx="7" fill="#e2e8f0"/><text x="126" y="270" fill="#0f172a" font-size="15" font-weight="400" text-anchor="middle">Option 4</text><rect x="207" y="242" width="123" height="43" rx="7" fill="#e2e8f0"/><text x="268" y="270" fill="#0f172a" font-size="15" font-weight="400" text-anchor="middle">Option 5</text><rect x="349" y="242" width="123" height="43" rx="7" fill="#e2e8f0"/><text x="410" y="270" fill="#0f172a" font-size="15" font-weight="400" text-anchor="middle">Option 6</text><rect x="65" y="296" width="123" height="43" rx="7" fill="#e2e8f0"/><text x="126" y="324" fill="#0f172a" font-size="15" font-weight="400" text-anchor="middle">Option 7</text><rect x="207" y="296" width="123" height="43" rx="7" fill="#e2e8f0"/><text x="268" y="324" fill="#0f172a" font-size="15" font-weight="400" text-anchor="middle">Option 8</text><rect x="349" y="296" width="123" height="43" rx="7" fill="#e2e8f0"/><text x="410" y="324" fill="#0f172a" font-size="15" font-weight="400" text-anchor="middle">Option 9</text><rect x="65" y="350" width="123" height="43" rx="7" fill="#e2e8f0"/><text x="126" y="378" fill="#0f172a" font-size="15" font-weight="400" text-anchor="middle">Option 10</text><rect x="207" y="350" width="123" height="43" rx="7" fill="#e2e8f0"/><text x="268" y="378" fill="#0f172a" font-size="15" font-weight="400" text-anchor="middle">Option 11</text><rect x="349" y="350" width="123" height="43" rx="7" fill="#e2e8f0"/><text x="410" y="378" fill="#0f172a" font-size="15" font-weight="400" text-anchor="middle">Option 12</text><rect x="561" y="194" width="404" height="59" rx="9" fill="#dbeafe"/><text x="583" y="231" fill="#0f172a" font-size="19" font-weight="700">Shop by category</text><rect x="561" y="265" width="404" height="59" rx="9" fill="#dcfce7"/><text x="583" y="302" fill="#0f172a" font-size="19" font-weight="700">Search products</text><rect x="561" y="336" width="404" height="59" rx="9" fill="#fef3c7"/><text x="583" y="373" fill="#0f172a" font-size="19" font-weight="700">View recent</text></g></svg>
