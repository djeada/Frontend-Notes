<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" role="img" aria-labelledby="title desc"><title id="title">Gestalt: proximity and similarity</title><desc id="desc">Scattered blue and teal circles become two close, visually consistent groups. Grouping suggests relations that must also be expressed by labels in a real UI.</desc><rect x="0" y="0" width="1040" height="470" rx="18" fill="#f8fafc"/><g font-family="Arial,sans-serif"><text x="34" y="46" fill="#0f172a" font-size="29" font-weight="700">Gestalt: proximity and similarity</text><text x="34" y="82" fill="#475569" font-size="16" font-weight="400">Do not use color alone to communicate group membership.</text><rect x="34" y="122" width="476" height="300" rx="15" fill="#ffffff" stroke="#cbd5e1"/><text x="56" y="156" fill="#0f172a" font-size="21" font-weight="700">BEFORE · unrelated proximity</text><rect x="530" y="122" width="476" height="300" rx="15" fill="#ffffff" stroke="#cbd5e1"/><text x="552" y="156" fill="#0f172a" font-size="21" font-weight="700">AFTER · grouped by meaning</text><circle cx="86" cy="211" r="24" fill="#087f8c"/><circle cx="215" cy="224" r="24" fill="#1d4ed8"/><circle cx="375" cy="191" r="24" fill="#087f8c"/><circle cx="130" cy="351" r="24" fill="#1d4ed8"/><circle cx="326" cy="334" r="24" fill="#087f8c"/><circle cx="267" cy="283" r="24" fill="#1d4ed8"/><rect x="574" y="168" width="386" height="96" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/><circle cx="649" cy="216" r="21" fill="#1d4ed8"/><circle cx="748" cy="216" r="21" fill="#1d4ed8"/><circle cx="847" cy="216" r="21" fill="#1d4ed8"/><rect x="574" y="287" width="386" height="96" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/><circle cx="649" cy="335" r="21" fill="#087f8c"/><circle cx="748" cy="335" r="21" fill="#087f8c"/><circle cx="847" cy="335" r="21" fill="#087f8c"/></g></svg>
