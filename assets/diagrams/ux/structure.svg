<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" role="img" aria-labelledby="title desc"><title id="title">Structure: group by task</title><desc id="desc">The left scatters blocks without clear relationships. The right groups order summary, delivery and payment in a predictable sequence.</desc><rect x="0" y="0" width="1040" height="470" rx="18" fill="#f8fafc"/><g font-family="Arial,sans-serif"><text x="34" y="46" fill="#0f172a" font-size="29" font-weight="700">Structure: group by task</text><text x="34" y="82" fill="#475569" font-size="16" font-weight="400">Test whether people can locate the next step without explanation.</text><rect x="34" y="122" width="476" height="300" rx="15" fill="#ffffff" stroke="#cbd5e1"/><text x="56" y="156" fill="#0f172a" font-size="21" font-weight="700">BEFORE · scattered content</text><rect x="530" y="122" width="476" height="300" rx="15" fill="#ffffff" stroke="#cbd5e1"/><text x="552" y="156" fill="#0f172a" font-size="21" font-weight="700">AFTER · meaningful groups</text><rect x="67" y="191" width="120" height="35" rx="4" fill="#cbd5e1"/><rect x="281" y="189" width="175" height="35" rx="4" fill="#cbd5e1"/><rect x="92" y="273" width="236" height="35" rx="4" fill="#cbd5e1"/><rect x="351" y="304" width="100" height="35" rx="4" fill="#cbd5e1"/><rect x="201" y="361" width="128" height="35" rx="4" fill="#cbd5e1"/><rect x="559" y="185" width="416" height="65" rx="8" fill="#dbeafe"/><text x="579" y="226" fill="#0f172a" font-size="20" font-weight="700">Order summary</text><rect x="559" y="263" width="416" height="65" rx="8" fill="#dcfce7"/><text x="579" y="305" fill="#0f172a" font-size="20" font-weight="700">Delivery details</text><rect x="559" y="340" width="240" height="54" rx="8" fill="#1d4ed8"/><text x="679" y="374" fill="#ffffff" font-size="17" font-weight="700" text-anchor="middle">Continue to payment</text></g></svg>
