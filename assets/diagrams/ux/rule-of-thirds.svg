<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" role="img" aria-labelledby="title desc"><title id="title">Rule of thirds: composition grid</title><desc id="desc">A three-by-three grid overlays a landscape illustration; intersection dots indicate optional placements for a subject.</desc><rect x="0" y="0" width="1040" height="470" rx="18" fill="#f8fafc"/><g font-family="Arial,sans-serif"><text x="34" y="46" fill="#0f172a" font-size="29" font-weight="700">Rule of thirds: composition grid</text><text x="34" y="82" fill="#475569" font-size="16" font-weight="400">Compositional aid, not a requirement to avoid centering.</text><rect x="228" y="126" width="578" height="290" rx="4" fill="#dbeafe"/><rect x="228" y="319" width="578" height="97" rx="0" fill="#bbf7d0"/><circle cx="613" cy="223" r="56" fill="#f59e0b"/><path d="M421 126 L421 416" stroke="#ffffff" stroke-width="3" fill="none" /><path d="M613 126 L613 416" stroke="#ffffff" stroke-width="3" fill="none" /><path d="M228 223 L806 223" stroke="#ffffff" stroke-width="3" fill="none" /><path d="M228 320 L806 320" stroke="#ffffff" stroke-width="3" fill="none" /><circle cx="421" cy="223" r="7" fill="#be123c"/><circle cx="421" cy="320" r="7" fill="#be123c"/><circle cx="613" cy="223" r="7" fill="#be123c"/><circle cx="613" cy="320" r="7" fill="#be123c"/><text x="84" y="256" fill="#475569" font-size="16" font-weight="400">Subject placed near</text><text x="84" y="279" fill="#475569" font-size="16" font-weight="400">a grid intersection</text></g></svg>
