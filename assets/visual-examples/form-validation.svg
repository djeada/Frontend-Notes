<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" role="img" aria-labelledby="title desc"><title id="title">JavaScript form before submission and after invalid input</title><desc id="desc">Before, a form shows an email label, field, and submit button. After an invalid submission, the field is marked invalid and an explicit text error appears beside it.</desc><rect width="820" height="330" rx="18" fill="#f1f5f9"/><g font-family="Arial,sans-serif" fill="#0f172a"><text x="26" y="37" font-size="22" font-weight="bold">JavaScript: show validation feedback</text><text x="36" y="70" font-size="14">BEFORE: awaiting input</text><text x="437" y="70" font-size="14">AFTER: invalid submission</text></g><rect x="24" y="82" width="372" height="220" rx="12" fill="white" stroke="#cbd5e1"/><rect x="425" y="82" width="370" height="220" rx="12" fill="white" stroke="#cbd5e1"/><g font-family="Arial,sans-serif" fill="#0f172a" font-size="15"><text x="46" y="118" font-weight="bold">Email address</text><text x="447" y="118" font-weight="bold">Email address</text></g><rect x="46" y="134" width="323" height="46" fill="white" stroke="#64748b" stroke-width="2" rx="7"/><rect x="447" y="134" width="324" height="46" fill="white" stroke="#b91c1c" stroke-width="3" rx="7"/><g font-family="Arial,sans-serif" font-size="15"><text x="58" y="163" fill="#64748b">name@example.com</text><text x="459" y="163" fill="#0f172a">not-an-email</text><text x="447" y="209" fill="#991b1b" font-size="14">Enter an email such as name@example.com.</text></g><rect x="46" y="215" width="115" height="45" rx="8" fill="#1d4ed8"/><rect x="447" y="231" width="115" height="45" rx="8" fill="#1d4ed8"/><g font-family="Arial,sans-serif" fill="white" font-size="15" font-weight="bold" text-anchor="middle"><text x="103" y="243">Subscribe</text><text x="504" y="259">Subscribe</text></g></svg>