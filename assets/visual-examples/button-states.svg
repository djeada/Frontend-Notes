<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" role="img" aria-labelledby="title desc"><title id="title">Comparison of poorly distinguished and well-defined button states</title><desc id="desc">Left shows three nearly identical low-contrast buttons. Right shows distinct default, hover, keyboard-focus, and disabled appearances with text labels; do not identify state using color alone.</desc><rect width="820" height="330" rx="18" fill="#f1f5f9"/><g font-family="Arial,sans-serif" fill="#0f172a"><text x="26" y="36" font-size="22" font-weight="bold">Buttons: communicate interaction states</text><text x="35" y="68" font-size="14">BEFORE: ambiguous states</text><text x="433" y="68" font-size="14">AFTER: clear states</text></g><rect x="26" y="80" width="367" height="223" rx="10" fill="white" stroke="#cbd5e1"/><rect x="424" y="80" width="370" height="223" rx="10" fill="white" stroke="#cbd5e1"/><g fill="#e5e7eb"><rect x="62" y="108" width="125" height="44" rx="7"/><rect x="62" y="169" width="125" height="44" rx="7"/><rect x="62" y="230" width="125" height="44" rx="7"/></g><g font-family="Arial,sans-serif" font-size="14" fill="#6b7280"><text x="81" y="135">Continue</text><text x="81" y="196">Continue</text><text x="81" y="257">Continue</text><text x="201" y="135">Default?</text><text x="201" y="196">Focused?</text><text x="201" y="257">Disabled?</text></g><rect x="446" y="102" width="130" height="39" rx="7" fill="#1d4ed8"/><rect x="627" y="102" width="130" height="39" rx="7" fill="#1e40af"/><rect x="446" y="183" width="130" height="39" rx="7" fill="#1d4ed8" stroke="#fff" stroke-width="4"/><rect x="440" y="177" width="142" height="51" rx="10" fill="none" stroke="#0f172a" stroke-width="3"/><rect x="627" y="183" width="130" height="39" rx="7" fill="#e2e8f0" stroke="#94a3b8"/><g font-family="Arial,sans-serif" font-size="13" fill="#334155"><text x="449" y="96">Default</text><text x="630" y="96">Hover</text><text x="449" y="171">Keyboard focus</text><text x="630" y="171">Disabled</text></g><g font-family="Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle"><text x="511" y="127" fill="white">Continue</text><text x="692" y="127" fill="white">Continue</text><text x="511" y="208" fill="white">Continue</text><text x="692" y="208" fill="#64748b">Unavailable</text></g></svg>