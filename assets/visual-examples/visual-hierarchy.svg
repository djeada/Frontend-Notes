<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" role="img" aria-labelledby="title desc"><title id="title">UX and UI: cluttered page compared with a page with hierarchy</title><desc id="desc">Before, calls to action, headings, and supporting text have uniform weight and cramped spacing. After, a prominent heading, concise supporting text, whitespace, and one primary action establish visual hierarchy.</desc><rect width="820" height="330" rx="18" fill="#f1f5f9"/><g font-family="Arial,sans-serif" fill="#0f172a"><text x="26" y="36" font-size="22" font-weight="bold">UI: guide attention with hierarchy</text><text x="36" y="70" font-size="14">BEFORE: competing elements</text><text x="437" y="70" font-size="14">AFTER: clear reading order</text></g><rect x="25" y="82" width="370" height="223" rx="10" fill="white" stroke="#cbd5e1"/><rect x="425" y="82" width="370" height="223" rx="10" fill="white" stroke="#cbd5e1"/><g fill="#334155" font-family="Arial,sans-serif" font-size="15"><text x="40" y="111">SALE! LEARN NOW! GET STARTED!</text><text x="40" y="138">Build better websites with our courses</text><text x="40" y="165">Tutorials Projects Videos Updates</text><text x="40" y="192">Join today | Latest news | Read more</text></g><rect x="40" y="207" width="145" height="34" fill="#94a3b8"/><rect x="195" y="207" width="145" height="34" fill="#94a3b8"/><g fill="white" font-family="Arial,sans-serif" font-size="13"><text x="66" y="229">Learn more</text><text x="225" y="229">Get started</text></g><g font-family="Arial,sans-serif"><text x="452" y="123" font-size="12" font-weight="bold" fill="#1d4ed8">FRONTEND WORKSHOP</text><text x="452" y="161" font-size="26" font-weight="bold" fill="#0f172a">Build better websites</text><text x="452" y="190" font-size="15" fill="#475569">Learn by building small, usable projects.</text></g><rect x="452" y="220" width="147" height="47" rx="8" fill="#1d4ed8"/><text x="525" y="249" text-anchor="middle" font-family="Arial,sans-serif" fill="white" font-size="15" font-weight="bold">Start learning</text></svg>