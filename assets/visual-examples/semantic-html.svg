<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" role="img" aria-labelledby="title desc"><title id="title">HTML structure: generic containers versus semantic landmarks</title><desc id="desc">Two otherwise similar page wireframes. Left uses anonymous div containers; right names header, navigation, main, and footer. Semantics improve meaning, not default appearance.</desc><rect width="820" height="330" rx="18" fill="#f1f5f9"/><g font-family="Arial,sans-serif" fill="#0f172a"><text x="32" y="36" font-size="21" font-weight="bold">HTML: same appearance, different meaning</text><text x="42" y="66" font-size="14">BEFORE: generic containers</text><text x="432" y="66" font-size="14">AFTER: semantic landmarks</text></g><g stroke="#94a3b8" fill="#fff" stroke-width="2"><rect x="30" y="78" width="365" height="207" rx="10"/><rect x="425" y="78" width="365" height="207" rx="10"/></g><g font-family="monospace" font-size="16" text-anchor="middle"><rect x="50" y="99" width="325" height="43" rx="5" fill="#e2e8f0"/><text x="212" y="126" fill="#334155">&lt;div&gt; Logo / menu &lt;/div&gt;</text><rect x="50" y="150" width="325" height="74" rx="5" fill="#e2e8f0"/><text x="212" y="180" fill="#334155">&lt;div&gt; Page content</text><text x="212" y="202" fill="#334155">&lt;/div&gt;</text><rect x="50" y="232" width="325" height="35" rx="5" fill="#e2e8f0"/><text x="212" y="255" fill="#334155">&lt;div&gt; Footer &lt;/div&gt;</text><rect x="445" y="99" width="325" height="43" rx="5" fill="#dbeafe"/><text x="607" y="126" fill="#1e40af">&lt;header&gt; &lt;nav&gt; ...</text><rect x="445" y="150" width="325" height="74" rx="5" fill="#dcfce7"/><text x="607" y="180" fill="#166534">&lt;main&gt; Page content</text><text x="607" y="202" fill="#166534">&lt;/main&gt;</text><rect x="445" y="232" width="325" height="35" rx="5" fill="#fef3c7"/><text x="607" y="255" fill="#92400e">&lt;footer&gt; ... &lt;/footer&gt;</text></g><g font-family="Arial,sans-serif" font-size="12" fill="#475569"><text x="41" y="310">The layout can look identical.</text><text x="432" y="310">Landmarks expose structure to assistive tech.</text></g></svg>