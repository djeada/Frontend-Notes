<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" role="img" aria-labelledby="title desc"><title id="title">Keyboard focus before and after adding a visible focus indicator</title><desc id="desc">Both panels show the same navigation link reached by Tab. Left has no visible indicator and a question mark; right has a thick dark outline offset from the blue link, making keyboard focus clear.</desc><rect width="820" height="330" rx="18" fill="#f1f5f9"/><g font-family="Arial,sans-serif" fill="#0f172a"><text x="26" y="35" font-size="22" font-weight="bold">Accessibility: make keyboard focus visible</text><text x="35" y="70" font-size="14">BEFORE: focus hidden</text><text x="438" y="70" font-size="14">AFTER: :focus-visible</text></g><rect x="25" y="81" width="371" height="217" fill="white" stroke="#cbd5e1" rx="10"/><rect x="424" y="81" width="371" height="217" fill="white" stroke="#cbd5e1" rx="10"/><rect x="66" y="115" width="274" height="56" rx="8" fill="#1d4ed8"/><rect x="465" y="115" width="274" height="56" rx="8" fill="#1d4ed8"/><rect x="456" y="106" width="292" height="74" rx="13" fill="none" stroke="#0f172a" stroke-width="4"/><g font-family="Arial,sans-serif" font-size="18" fill="white" text-anchor="middle"><text x="203" y="150">View course</text><text x="602" y="150">View course</text></g><g font-family="Arial,sans-serif" font-size="16"><text x="65" y="213" fill="#991b1b">Tab pressed. Where is focus?</text><text x="465" y="213" fill="#166534">Tab pressed. Focus is obvious.</text><text x="65" y="261" fill="#475569" font-size="13">Avoid outline: none without a replacement.</text><text x="465" y="261" fill="#475569" font-size="13">outline: 3px solid; outline-offset: 5px;</text></g></svg>