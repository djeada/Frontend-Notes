<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" role="img" aria-labelledby="title desc"><title id="title">Responsive navigation shown at wide and narrow viewport widths</title><desc id="desc">A wide browser shows the brand and three links in a horizontal row. A narrow mobile browser shows the brand and the same links stacked, avoiding horizontal overflow.</desc><rect width="820" height="330" rx="18" fill="#f1f5f9"/><g font-family="Arial,sans-serif" fill="#0f172a"><text x="28" y="36" font-size="22" font-weight="bold">Responsive: adapt to available width</text><text x="34" y="69" font-size="14">WIDE VIEWPORT</text><text x="561" y="69" font-size="14">NARROW VIEWPORT</text></g><rect x="27" y="81" width="486" height="226" rx="12" fill="white" stroke="#64748b" stroke-width="2"/><rect x="36" y="91" width="468" height="59" rx="8" fill="#1e293b"/><g font-family="Arial,sans-serif" fill="white"><text x="57" y="127" font-size="20" font-weight="bold">Atlas</text><text x="274" y="127" font-size="15">Courses</text><text x="360" y="127" font-size="15">Pricing</text><text x="430" y="127" font-size="15">Help</text></g><g fill="#e2e8f0"><rect x="56" y="178" width="424" height="15" rx="5"/><rect x="56" y="205" width="325" height="15" rx="5"/><rect x="56" y="232" width="378" height="15" rx="5"/></g><rect x="543" y="81" width="253" height="226" rx="17" fill="white" stroke="#64748b" stroke-width="2"/><rect x="551" y="90" width="237" height="160" rx="8" fill="#1e293b"/><g font-family="Arial,sans-serif" fill="white" font-size="15"><text x="568" y="117" font-size="19" font-weight="bold">Atlas</text><text x="568" y="154">Courses</text><text x="568" y="188">Pricing</text><text x="568" y="222">Help</text></g><rect x="565" y="270" width="210" height="12" rx="5" fill="#cbd5e1"/><text x="33" y="321" font-size="11" font-family="Arial,sans-serif" fill="#475569">Same navigation links; layout switches at a breakpoint or based on available space.</text></svg>