<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" role="img" aria-labelledby="title desc"><title id="title">Before and after styling a product card</title><desc id="desc">Left is an unstyled product title, paragraph, and link; right groups the same content in a padded card with readable hierarchy and a distinct call-to-action.</desc><rect width="820" height="330" rx="18" fill="#f1f5f9"/><g font-family="Arial,sans-serif" fill="#0f172a"><text x="28" y="36" font-size="22" font-weight="bold">CSS: a card gains hierarchy</text><text x="38" y="69" font-size="14">BEFORE: browser defaults</text><text x="438" y="69" font-size="14">AFTER: spacing and styling</text></g><rect x="25" y="80" width="372" height="222" fill="white" stroke="#cbd5e1" rx="8"/><g font-family="Arial,sans-serif"><text x="44" y="119" fill="#111827" font-size="21" font-weight="bold">Starter course</text><text x="44" y="153" fill="#111827" font-size="15">Learn to build a small web page.</text><text x="44" y="185" fill="#1d4ed8" font-size="15" text-decoration="underline">View course</text></g><rect x="425" y="80" width="370" height="222" fill="#dbeafe" rx="8"/><rect x="450" y="96" width="320" height="190" fill="white" stroke="#bfdbfe" rx="14"/><rect x="472" y="113" width="68" height="10" rx="5" fill="#93c5fd"/><g font-family="Arial,sans-serif"><text x="472" y="157" fill="#0f172a" font-size="22" font-weight="bold">Starter course</text><text x="472" y="183" fill="#475569" font-size="14">Learn to build a small web page.</text></g><rect x="472" y="208" width="132" height="44" rx="9" fill="#1d4ed8"/><text x="538" y="235" fill="white" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" font-weight="bold">View course</text></svg>