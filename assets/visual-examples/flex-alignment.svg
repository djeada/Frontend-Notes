<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" role="img" aria-labelledby="title desc"><title id="title">Before and after using Flexbox for a toolbar</title><desc id="desc">Before, toolbar elements wrap awkwardly without grouping. After, a flex container aligns the title on the left and controls on the right, with wrapping when space is constrained.</desc><rect width="820" height="330" rx="18" fill="#f1f5f9"/><g font-family="Arial,sans-serif" fill="#0f172a"><text x="26" y="35" font-size="22" font-weight="bold">Flexbox: align related controls</text><text x="38" y="68" font-size="14">BEFORE: disconnected flow</text><text x="439" y="68" font-size="14">AFTER: flex plus gap</text></g><rect x="25" y="82" width="372" height="207" rx="9" fill="white" stroke="#cbd5e1"/><rect x="425" y="82" width="370" height="207" rx="9" fill="white" stroke="#cbd5e1"/><g font-family="Arial,sans-serif" fill="#0f172a"><text x="43" y="121" font-size="22" font-weight="bold">My tasks</text><text x="43" y="194" font-size="15" fill="#475569">The buttons split onto new lines.</text><text x="448" y="194" font-size="15" fill="#475569">Controls share one aligned row.</text><text x="445" y="121" font-size="22" font-weight="bold">My tasks</text></g><rect x="43" y="135" width="111" height="40" rx="7" fill="#e2e8f0"/><rect x="43" y="211" width="123" height="40" rx="7" fill="#e2e8f0"/><rect x="620" y="95" width="73" height="40" rx="7" fill="#e2e8f0"/><rect x="704" y="95" width="74" height="40" rx="7" fill="#1d4ed8"/><g font-family="Arial,sans-serif" font-size="14" text-anchor="middle"><text x="98" y="160" fill="#334155">Filter</text><text x="104" y="237" fill="#334155">New task</text><text x="656" y="120" fill="#334155">Filter</text><text x="741" y="120" fill="white">New</text></g><text x="445" y="252" font-family="monospace" fill="#2563eb" font-size="13">display:flex; gap:12px; flex-wrap:wrap;</text></svg>