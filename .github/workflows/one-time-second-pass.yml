name: One-time second in-place documentation pass

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  expand-original-notes:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'docs/review-and-expand-frontend-notes-2026'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/review-and-expand-frontend-notes-2026
          fetch-depth: 0
          persist-credentials: true
      - name: Verify scripts and expand all thirteen originals
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          # Match complete heading lines, never a shorter heading contained in one
          # beginning with more '#'. These stage-only helpers are removed at commit.
          helper='''def insert(filename, heading, body):
              path = NOTES / filename
              source = path.read_text(encoding='utf-8')
              lines = source.splitlines(keepends=True)
              hits = [i for i, line in enumerate(lines) if line.rstrip('\\r\\n') == heading]
              assert len(hits) == 1, f'{filename}: missing or ambiguous exact heading {heading!r}'
              assert body.strip().splitlines()[0] not in source, f'{filename}: already inserted'
              lines.insert(hits[0] + 1, '\\n' + body.strip() + '\\n\\n')
              path.write_text(''.join(lines), encoding='utf-8')
              modified.add(filename)
          '''
          # The string above is indented in YAML only; remove its common indent.
          import textwrap
          helper=textwrap.dedent(helper)
          for name in ['tools/second_pass_a.py','tools/second_pass_b.py']:
              p=Path(name); s=p.read_text(encoding='utf-8')
              a=s.index('def insert(filename, heading, body):')
              b=s.index('\n\ndef correct(', a)
              s=s[:a]+helper.rstrip()+s[b:]
              p.write_text(s, encoding='utf-8')
          print('Exact Markdown heading anchors installed in temporary scripts.')
          PY
          python3 -m py_compile tools/second_pass_a.py tools/second_pass_b.py
          python3 tools/second_pass_a.py
          python3 tools/second_pass_b.py
      - name: Validate content, links, and runnable JavaScript lesson
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, xml.etree.ElementTree as ET
          root=Path.cwd()
          paths=sorted((root/'notes').glob('[0-1][0-9]_*.md'))
          assert len(paths)==13, [p.name for p in paths]
          result=subprocess.run(['git','diff','--numstat','--','notes/'],capture_output=True,text=True,check=True).stdout
          changed={line.split('\t')[-1] for line in result.splitlines()}
          assert {str(p.relative_to(root)) for p in paths} == changed, (len(changed),changed)
          newlines=sum(int(line.split('\t')[0]) for line in result.splitlines())
          print('New lines in original chapters in this second pass:',newlines)
          assert newlines>=750, 'Unexpectedly small update: inspect lost blocks'
          for p in paths:
              text=p.read_text(encoding='utf-8')
              old=subprocess.run(['git','show',f'HEAD:{p.relative_to(root)}'],capture_output=True,text=True,check=True).stdout
              assert len(text)>=len(old), f'This pass removed chapter content: {p.name}'
              assert 'notes/revisions/' not in text
          for svg in (root/'assets').rglob('*.svg'): ET.parse(svg)
          diff=subprocess.run(['git','diff','-U0','--','notes/'],capture_output=True,text=True,check=True).stdout
          links=0
          for line in diff.splitlines():
              if not line.startswith('+') or line.startswith('+++'): continue
              for raw in re.findall(r'(?<!\\)\]\(([^)]+)\)',line[1:]):
                  dest=raw.split('#',1)[0].strip()
                  if not dest or dest.startswith(('http:','https:','mailto:','#')): continue
                  target=(root/'notes'/dest).resolve()
                  assert target.is_file() or target.is_dir(), f'Broken new local link: {dest}'
                  links+=1
          source=(root/'notes/10_testing.md').read_text(encoding='utf-8')
          m=re.search(r'`price\.js`:\s*\n```js\n(.*?)\n```.*?`price\.test\.js`:\s*\n```js\n(.*?)\n```',source,re.S)
          assert m, 'Missing self-contained testing lesson'
          with tempfile.TemporaryDirectory() as d:
              Path(d,'price.js').write_text(m.group(1),encoding='utf-8')
              Path(d,'price.test.js').write_text(m.group(2),encoding='utf-8')
              subprocess.run(['node','--test','price.test.js'],cwd=d,check=True)
          subprocess.run(['node','--check','projects/visual-examples/script.js'],check=True)
          print(f'All 13 chapters changed, {links} new local links checked, SVG XML valid, Node lesson passed.')
          PY
      - name: Commit substantive chapters and clean away one-time tooling
        shell: bash
        run: |
          git rm -f .github/workflows/one-time-second-pass.yml tools/second_pass_a.py tools/second_pass_b.py
          git add -A
          git diff --cached --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: deepen all 13 original chapters with worked examples and exercises'
          git push origin HEAD:docs/review-and-expand-frontend-notes-2026
