name: One-time UX editorial polish

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  polish:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'docs/ux-principles-illustrated-2026'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/ux-principles-illustrated-2026
          fetch-depth: 0
          persist-credentials: true
      - name: Remove duplicate art and correct final overstatements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('notes/06_ux.md')
          s=p.read_text(encoding='utf-8')
          edits={
            '\n![Before and after: Gestalt proximity and similarity group related elements](../assets/diagrams/ux/gestalt.svg)\n\n\n## Intriguing Design Observations':'\n\n## Intriguing Design Observations',
            'Visualization:\n\n![Hick–Hyman heuristic: twelve choices versus organized task groups]':'**Visual example:**\n\n![Hick–Hyman heuristic: twelve choices versus organized task groups]',
            '- Adjusting images to fit within Golden Ratio dimensions for optimal focus.':'- Exploring golden-ratio crop or panel dimensions as a sketching experiment, then checking what fits the subject and text.',
            '- Place images on the left side to catch the user\'s eye during vertical scanning.':'- Place illustrations near the information they clarify; let reading direction, content and task guide placement.',
            '- Apply the dominant color to primary interface elements, the secondary color to highlight areas, and the accent color for alerts or notifications.':'- Use the dominant and secondary colors for surfaces and a distinct accent for emphasis; keep error, warning and success states semantically identifiable instead of relying on one accent hue.',
            '- Is the product gender-specific or does it cater to all?':'- Which tasks, accessibility needs and cultural contexts must the product support, and which assumptions need research?',
            'In simpler terms, more options can lead to decision fatigue or **analysis paralysis**, where the user feels overwhelmed and is less likely to make any decision at all.':'In a controlled choice task, additional plausible alternatives can increase decision time. That does not prove that fewer items always make a real website easier: labels, grouping, familiarity and task requirements matter.',
          }
          for a,b in edits.items():
              assert s.count(a)==1,(a[:65],s.count(a))
              s=s.replace(a,b)
          p.write_text(s,encoding='utf-8')
          print('Editorial corrections applied; duplicate Gestalt image removed.')
          PY
      - name: Validate SVG geometry, all links and original chapter retention
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,xml.etree.ElementTree as ET,subprocess
          p=Path('notes/06_ux.md');s=p.read_text(encoding='utf-8')
          assets=Path('assets/diagrams/ux');files=sorted(assets.glob('*.svg'))
          assert len(files)==19
          refs=re.findall(r'!\[[^\]]*\]\((\.\./assets/diagrams/ux/[^)]+\.svg)\)',s)
          assert len(refs)==19 and len(set(refs))==19,(len(refs),len(set(refs)))
          for ref in refs: assert (p.parent/ref).is_file(),ref
          for svg in files:
              node=ET.parse(svg).getroot(); width,height=map(float,node.attrib['viewBox'].split()[-2:])
              assert node.find('{http://www.w3.org/2000/svg}title') is not None
              assert node.find('{http://www.w3.org/2000/svg}desc') is not None
              for child in node.iter():
                  if child.tag.endswith('text'):
                      assert 0<=float(child.attrib.get('x','0'))<=width and 0<=float(child.attrib.get('y','0'))<=height,(svg,child.attrib)
          assert '```\n[Rule of Thirds Grid]' not in s
          assert s.count('gestalt.svg')==1
          original=subprocess.run(['git','show','origin/main:notes/06_ux.md'],capture_output=True,text=True,check=True).stdout
          assert len(s)>len(original),'Unexpected original chapter content loss'
          print('PASS: 19 distinct locally embedded figures, valid SVG XML and text coordinates, preserved original prose.')
          PY
      - name: Commit edited notes and remove this temporary check
        shell: bash
        run: |
          git rm -f .github/workflows/one-time-ux-polish.yml
          git add notes/06_ux.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(ux): remove duplicate art and tighten heuristic guidance'
          git push origin HEAD:docs/ux-principles-illustrated-2026
