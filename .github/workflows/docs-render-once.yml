name: One-time visual examples render and check

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  render-visual-examples:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'docs/review-and-expand-frontend-notes-2026'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/review-and-expand-frontend-notes-2026
          fetch-depth: 0
          persist-credentials: true
      - name: Install isolated browser test dependency
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/frontend-browser-test"
          cd "$RUNNER_TEMP/frontend-browser-test"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --no-save playwright
          npx playwright install chromium
      - name: Serve and test the actual browser examples; export eight pairs
        shell: bash
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/frontend-notes-server.log 2>&1 &
          export NODE_PATH="$RUNNER_TEMP/frontend-browser-test/node_modules"
          node <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless: true});
            try {
              const page = await browser.newPage({viewport: {width: 1280, height: 900}, deviceScaleFactor: 1});
              await page.goto('http://127.0.0.1:8000/projects/visual-examples/', {waitUntil: 'load'});
              assert.equal(await page.locator('main').count(), 1, 'host page should have one main');
              assert.equal(await page.locator('section').count(), 8, 'eight real teaching sections');
              assert.equal(await page.frameLocator('iframe[src="semantic-before.html"]').locator('main').count(), 0, 'before document has generic containers');
              assert.equal(await page.frameLocator('iframe[src="semantic-after.html"]').locator('main').count(), 1, 'after document has a semantic main');
              assert.equal(await page.locator('.wide-frame .demo-nav').evaluate(el => getComputedStyle(el).flexDirection), 'row');
              assert.equal(await page.locator('.narrow-frame .demo-nav').evaluate(el => getComputedStyle(el).flexDirection), 'column');
              await page.locator('#live-email').fill('not-an-email');
              await page.locator('#newsletter button[type="submit"]').click();
              assert.match(await page.locator('#email-feedback').textContent(), /enter an email/i);
              assert.equal(await page.locator('#live-email').getAttribute('aria-invalid'), 'true');
              const captures = {
                semantic: 'semantic-html', card: 'card-styling', alignment: 'flex-alignment',
                responsive: 'responsive-navigation', validation: 'form-validation',
                states: 'button-states', hierarchy: 'visual-hierarchy',
                'keyboard-focus': 'keyboard-focus'
              };
              for (const [section, base] of Object.entries(captures)) {
                await page.locator(`#${section} .compare`).screenshot({path: `assets/visual-examples/${base}-browser.png`});
                assert.ok(fs.statSync(`assets/visual-examples/${base}-browser.png`).size > 1000, `empty capture ${base}`);
              }
              await page.locator('#live-email').fill('name@example.com');
              await page.locator('#newsletter button[type="submit"]').click();
              assert.match(await page.locator('#email-feedback').textContent(), /valid in this browser/i);
              await page.close();
              const mobile = await browser.newPage({viewport: {width: 390, height: 844}, deviceScaleFactor: 1});
              await mobile.goto('http://127.0.0.1:8000/projects/visual-examples/', {waitUntil: 'load'});
              assert.equal(await mobile.locator('main').count(), 1);
              await mobile.locator('#responsive').screenshot({path:'assets/visual-examples/responsive-navigation-mobile.png'});
              assert.ok(fs.statSync('assets/visual-examples/responsive-navigation-mobile.png').size > 1000);
              console.log('PASS: eight desktop before/after captures, mobile capture, main landmarks, container queries, invalid and valid form behavior.');
              await mobile.close();
            } finally { await browser.close(); }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          JS
      - name: Put real rendered comparisons alongside explanations and check paths
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, xml.etree.ElementTree as ET
          assets = Path('assets/visual-examples')
          names = ('semantic-html','card-styling','flex-alignment','responsive-navigation','form-validation','button-states','visual-hierarchy','keyboard-focus')
          for name in names:
              assert (assets / f'{name}-browser.png').read_bytes().startswith(b'\x89PNG\r\n\x1a\n')
              ET.parse(assets / f'{name}.svg')
          assert (assets / 'responsive-navigation-mobile.png').read_bytes().startswith(b'\x89PNG\r\n\x1a\n')
          for path in Path('notes').glob('*.md'):
              text = path.read_text()
              for name in names:
                  marker = f'](../assets/visual-examples/{name}.svg)'
                  if marker not in text:
                      continue
                  pattern = r'(!\[[^\]]*\]\(\.\./assets/visual-examples/' + re.escape(name) + r'\.svg\))'
                  text = re.sub(pattern, lambda m: m.group(1) + '\n\n**Actual browser-rendered before/after:**\n\n![Browser screenshot of the ' + name.replace('-', ' ') + ' comparison](../assets/visual-examples/' + name + '-browser.png)', text)
              if path.name == '07_ui.md':
                  marker = '![Browser screenshot of the responsive navigation comparison](../assets/visual-examples/responsive-navigation-browser.png)'
                  if marker in text:
                      text = text.replace(marker, marker + '\n\n[See the narrow-screen browser capture](../assets/visual-examples/responsive-navigation-mobile.png)', 1)
              path.write_text(text)
          readme = Path('README.md')
          text = readme.read_text()
          marker = '## Visual examples: see what changes in the browser'
          assert marker in text
          text = text.replace(marker, marker + '\n\n![Actual browser screenshot comparing the before and after styled cards](assets/visual-examples/card-styling-browser.png)\n', 1)
          readme.write_text(text)
          for path in list(Path('notes').glob('*.md')) + [readme]:
              text = path.read_text()
              for target in re.findall(r'!\[[^\]]*\]\(([^)]+)\)', text):
                  if target.startswith('../assets/') or target.startswith('assets/'):
                      assert (path.parent / target).is_file(), (path, target)
          assert not Path('notes/revisions').exists(), 'duplicate companions should remain removed'
          print('PASS: browser PNG signatures, eight SVG XML files, local asset links, no duplicate companion notes.')
          PY
      - name: Commit the screenshots, remove this one-time workflow and push PR branch
        shell: bash
        run: |
          git rm .github/workflows/docs-render-once.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: embed browser-rendered before and after PNGs in original chapters'
          git push origin HEAD:docs/review-and-expand-frontend-notes-2026