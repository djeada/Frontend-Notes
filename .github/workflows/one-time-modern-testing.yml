name: One-time modern testing notes and real screenshots
on:
  push:
    branches: [docs/testing-feature-regression-guide-2026]
permissions:
  contents: write
jobs:
  finalize:
    if: github.repository == 'djeada/Frontend-Notes' && github.ref == 'refs/heads/docs/testing-feature-regression-guide-2026'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/testing-feature-regression-guide-2026
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate lockfile and install teaching project's browser
        working-directory: projects/testing-feature
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Validate the actual feature at all three boundaries
        working-directory: projects/testing-feature
        run: |
          npm run test:unit
          npm run test:e2e
          CAPTURE_DOC_SHOTS=1 npx playwright test -g 'capture real documented UI states'
      - name: Rewrite existing chapter in place and validate screenshot evidence
        run: |
          python3 -B tools/modern_testing_pass.py
          python3 - <<'PY'
          from pathlib import Path
          import re, struct, subprocess
          root=Path.cwd()
          note=root/'notes/10_testing.md'
          old=subprocess.run(['git','show','HEAD:notes/10_testing.md'],check=True,text=True,capture_output=True).stdout
          text=note.read_text()
          assert len(text)>len(old) and '## Worked example: keep a shipping quote working' in text
          assert text.count('### What is testing?')==1
          for name in ['shipping-before.png','shipping-success.png','shipping-error.png']:
              path=root/'assets/testing-feature'/name
              raw=path.read_bytes()
              assert raw.startswith(b'\x89PNG\r\n\x1a\n'),name
              width,height=struct.unpack('>II',raw[16:24]); assert width>=1000 and height>=600,(name,width,height)
              assert f'../assets/testing-feature/{name}' in text
              print('Real Chromium screenshot:',name,width,height,'bytes:',len(raw))
          links=re.findall(r'!?\[[^\]]*\]\((\.\./[^)]+)\)',text)
          for target in links:
              assert (note.parent/target).exists(),f'Invalid local path: {target}'
          print('Local documentation paths checked:',len(links))
          PY
          git diff --check
      - name: Commit real screenshots, tests and expanded original chapter; remove one-time tooling
        run: |
          git rm .github/workflows/one-time-modern-testing.yml tools/modern_testing_pass.py
          git add notes/10_testing.md assets/testing-feature/
          git add -f projects/testing-feature/package-lock.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(testing): teach regression prevention with executable feature and browser screenshots'
          git push origin HEAD:docs/testing-feature-regression-guide-2026
