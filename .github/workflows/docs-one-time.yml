name: One-time in-place notes revision

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  revise-original-chapters:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'docs/review-and-expand-frontend-notes-2026'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/review-and-expand-frontend-notes-2026
          fetch-depth: 0
          persist-credentials: true
      - name: Reconstruct and verify one-time revision script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, zlib
          parts = [Path(f'tools/revision-payload.part{i}').read_text(encoding='utf-8').strip() for i in range(1, 5)]
          code = zlib.decompress(base64.b64decode(''.join(parts)))
          expected = 'f433c538d45b66def2f934fbf432e9c7339a09fd2a6d492af47e6ea89d5318ad'
          actual = hashlib.sha256(code).hexdigest()
          assert actual == expected, f'Revision payload integrity failed: {actual}'
          Path('tools/_apply_once.py').write_bytes(code)
          print('Verified one-time revision script SHA-256:', actual)
          PY
      - name: Update original chapters, restore original README, and check diagrams
        run: python3 tools/_apply_once.py
      - name: Commit only the reviewed documentation changes
        shell: bash
        run: |
          git rm -f .github/workflows/docs-one-time.yml tools/revision-payload.part1 tools/revision-payload.part2 tools/revision-payload.part3 tools/revision-payload.part4
          rm -f tools/_apply_once.py
          git add -A
          git diff --cached --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: improve all existing notes in place and integrate visual teaching examples'
          git push origin HEAD:docs/review-and-expand-frontend-notes-2026